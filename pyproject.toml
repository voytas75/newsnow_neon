[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsnow-neon"
version = "0.53.0"
description = "A desktop news-ticker and summarization app (Neon edition)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "voytas75" }
]
keywords = ["news", "desktop", "ticker", "summaries"]

# Runtime dependencies discovered from import analysis
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyright==1.1.411",
  "ruff>=0.4.0",
]
redis = [
  "redis>=5.0",
]
llm = [
  "litellm>=1.40",
]
dotenv = [
  "python-dotenv>=1.0",
]

[project.scripts]
newsnow-neon = "newsnow_neon.__main__:_run"

[tool.uv]
default-groups = []

[tool.uv.sources]
newsnow-neon = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP", "D", "N", "C90"]

[tool.pyright]
include = ["newsnow_neon", "tests"]
exclude = ["build"]

[tool.setuptools.packages.find]
where = ["."]
